<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Category Emoji: Productivity (Продуктивность) -->
  <!-- Rocket with speed lines -->
  
  <defs>
    <linearGradient id="rocketGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FB923C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    
    <style>
      @keyframes launch {
        0%, 100% { transform: translateY(0) rotate(45deg); }
        50% { transform: translateY(-8px) rotate(45deg); }
      }
      
      .rocket-body {
        animation: launch 2s ease-in-out infinite;
        transform-origin: 32px 32px;
      }
      
      @keyframes flameFlutter {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.85); }
      }
      
      .flame {
        animation: flameFlutter 0.8s ease-in-out infinite;
        transform-origin: 32px 54px;
      }
      
      @keyframes speedLine {
        0% { opacity: 0; transform: translateX(-10px); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateX(10px); }
      }
      
      .speed-line {
        animation: speedLine 1s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Speed lines (background) -->
  <g stroke="#F97316" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <line x1="8" y1="24" x2="14" y2="24" class="speed-line" style="animation-delay: 0s;"/>
    <line x1="6" y1="32" x2="14" y2="32" class="speed-line" style="animation-delay: 0.3s;"/>
    <line x1="8" y1="40" x2="14" y2="40" class="speed-line" style="animation-delay: 0.6s;"/>
  </g>

  <!-- Rocket body -->
  <g class="rocket-body">
    <!-- Main rocket cone -->
    <path d="M 30 8 L 34 8 L 36 20 L 28 20 Z" 
          fill="url(#rocketGradient)" stroke="#F97316" stroke-width="1"/>
    
    <!-- Rocket body -->
    <rect x="28" y="20" width="8" height="20" rx="2" 
          fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
    
    <!-- Window (porthole) -->
    <circle cx="32" cy="24" r="2" fill="#FFD700" opacity="0.9"/>
    
    <!-- Left wing -->
    <path d="M 28 32 L 18 40 L 22 44 L 28 36 Z" 
          fill="#818CF8" stroke="#6366F1" stroke-width="1"/>
    
    <!-- Right wing -->
    <path d="M 36 32 L 46 40 L 42 44 L 36 36 Z" 
          fill="#818CF8" stroke="#6366F1" stroke-width="1"/>
    
    <!-- Bottom (nozzle) -->
    <rect x="29" y="40" width="6" height="4" rx="1" 
          fill="#1F2937" stroke="#000" stroke-width="0.5"/>
  </g>

  <!-- Flame -->
  <g class="flame" opacity="0.95">
    <!-- Main flame -->
    <path d="M 30 44 L 32 54 L 34 44 Q 32 48 30 44" 
          fill="url(#rocketGradient)" stroke="none"/>
    
    <!-- Inner flame (yellow) -->
    <path d="M 31 46 L 32 50 L 33 46 Q 32 48 31 46" 
          fill="#FFD700" stroke="none"/>
  </g>

  <!-- Glow effect -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FB923C" 
          stroke-width="1" opacity="0.2" stroke-dasharray="4 4"/>
</svg>