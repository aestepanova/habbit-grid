<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Category Emoji: Health (Здоровье) -->
  <!-- Heartbeat with rhythm waves -->
  
  <defs>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
    
    <style>
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.15); }
        50% { transform: scale(1); }
      }
      
      .heart-icon {
        animation: heartbeat 1.5s ease-in-out infinite;
        transform-origin: 32px 24px;
      }
      
      @keyframes wavePulse {
        0% { stroke-dashoffset: 20; opacity: 0; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: -20; opacity: 0; }
      }
      
      .wave-line {
        animation: wavePulse 1s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Heart shape -->
  <g class="heart-icon">
    <!-- Left lobe -->
    <circle cx="24" cy="20" r="6" fill="url(#healthGradient)"/>
    <!-- Right lobe -->
    <circle cx="40" cy="20" r="6" fill="url(#healthGradient)"/>
    <!-- Bottom point -->
    <path d="M 24 20 L 20 32 Q 32 44 32 44 Q 44 32 44 20 L 40 20" 
          fill="url(#healthGradient)" stroke="#EC4899" stroke-width="1"/>
  </g>

  <!-- Heartbeat rhythm lines -->
  <g stroke="#EC4899" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Line 1 (small pulse) -->
    <path d="M 12 48 L 14 48 L 15 45 L 16 48 L 18 48" 
          class="wave-line" style="animation-delay: 0s;"/>
    
    <!-- Line 2 (medium pulse) -->
    <path d="M 20 48 L 22 48 L 23 43 L 24 48 L 26 48" 
          class="wave-line" style="animation-delay: 0.2s;"/>
    
    <!-- Line 3 (large pulse) -->
    <path d="M 28 48 L 30 48 L 32 38 L 34 48 L 36 48" 
          class="wave-line" style="animation-delay: 0.4s;"/>
    
    <!-- Line 4 (medium pulse) -->
    <path d="M 40 48 L 42 48 L 43 43 L 44 48 L 46 48" 
          class="wave-line" style="animation-delay: 0.6s;"/>
    
    <!-- Line 5 (small pulse) -->
    <path d="M 48 48 L 50 48 L 51 45 L 52 48 L 54 48" 
          class="wave-line" style="animation-delay: 0.8s;"/>
  </g>

  <!-- Plus sign (medical) -->
  <g opacity="0.8">
    <rect x="50" y="34" width="2" height="8" fill="#10B981"/>
    <rect x="47" y="37" width="8" height="2" fill="#10B981"/>
  </g>
</svg>