<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Category Emoji: Personal Growth (Личное развитие) -->
  <!-- Growing seedling with upward trajectory -->
  
  <defs>
    <linearGradient id="growthGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7B7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="soilGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    
    <style>
      @keyframes grow {
        0% { transform: scaleY(0.8); }
        50% { transform: scaleY(1.05); }
        100% { transform: scaleY(1); }
      }
      
      .seedling {
        animation: grow 3s ease-in-out infinite;
        transform-origin: 32px 48px;
      }
      
      @keyframes arrowUp {
        0% { opacity: 0; transform: translateY(8px); }
        50% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-8px); }
      }
      
      .arrow {
        animation: arrowUp 2s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Soil/pot -->
  <rect x="22" y="40" width="20" height="16" rx="2" 
        fill="url(#soilGradient)" stroke="#78350F" stroke-width="1.5"/>
  
  <!-- Soil texture -->
  <line x1="24" y1="48" x2="40" y2="48" stroke="#78350F" stroke-width="0.5" opacity="0.5"/>
  <line x1="24" y1="52" x2="40" y2="52" stroke="#78350F" stroke-width="0.5" opacity="0.5"/>

  <!-- Seedling/plant -->
  <g class="seedling">
    <!-- Main stem -->
    <path d="M 32 48 Q 31 40 32 28" 
          stroke="url(#growthGradient)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Left leaf (big) -->
    <ellipse cx="24" cy="36" rx="6" ry="10" transform="rotate(-45 24 36)"
             fill="url(#growthGradient)" stroke="#059669" stroke-width="1" opacity="0.9"/>
    <line x1="24" y1="36" x2="20" y2="40" stroke="#059669" stroke-width="1" opacity="0.6"/>
    
    <!-- Right leaf (big) -->
    <ellipse cx="40" cy="36" rx="6" ry="10" transform="rotate(45 40 36)"
             fill="url(#growthGradient)" stroke="#059669" stroke-width="1" opacity="0.9"/>
    <line x1="40" y1="36" x2="44" y2="40" stroke="#059669" stroke-width="1" opacity="0.6"/>
    
    <!-- Left small leaf -->
    <ellipse cx="28" cy="24" rx="4" ry="7" transform="rotate(-50 28 24)"
             fill="#6EE7B7" stroke="#059669" stroke-width="0.5" opacity="0.8"/>
    
    <!-- Right small leaf -->
    <ellipse cx="36" cy="24" rx="4" ry="7" transform="rotate(50 36 24)"
             fill="#6EE7B7" stroke="#059669" stroke-width="0.5" opacity="0.8"/>
    
    <!-- Top leaf (tiny) -->
    <ellipse cx="32" cy="16" rx="3" ry="5" transform="rotate(0 32 16)"
             fill="#A7F3D0" stroke="#059669" stroke-width="0.5" opacity="0.7"/>
  </g>

  <!-- Upward growth arrows (trajectory) -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arrow 1 -->
    <g class="arrow" style="animation-delay: 0s;">
      <path d="M 48 38 L 54 32 L 50 32"/>
    </g>
    
    <!-- Arrow 2 -->
    <g class="arrow" style="animation-delay: 0.6s;">
      <path d="M 48 26 L 54 20 L 50 20"/>
    </g>
    
    <!-- Arrow 3 -->
    <g class="arrow" style="animation-delay: 1.2s;">
      <path d="M 48 14 L 54 8 L 50 8"/>
    </g>
  </g>

  <!-- Water droplet (nourishment) -->
  <g opacity="0.7">
    <path d="M 16 44 Q 15 46 16 48 Q 17 46 16 44" 
          fill="#3B82F6" stroke="#2563EB" stroke-width="0.5"/>
  </g>

  <!-- Glow effect -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#10B981" 
          stroke-width="0.5" opacity="0.2" stroke-dasharray="3 3"/>
</svg>