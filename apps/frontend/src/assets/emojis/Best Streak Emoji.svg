<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Custom Emoji: Best Streak (Огонь с числом дней) -->
  <!-- Used for: "Лучшая серия дней - 1 день" -->
  
  <defs>
    <linearGradient id="fireGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD500;stop-opacity:1" />
    </linearGradient>
    
    <filter id="fireGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <style>
      @keyframes flameFlicker {
        0%, 100% { transform: scaleY(1) scaleX(1); }
        25% { transform: scaleY(1.05) scaleX(0.98); }
        50% { transform: scaleY(0.98) scaleX(1.02); }
        75% { transform: scaleY(1.02) scaleX(0.99); }
      }
      
      .emoji-flame {
        animation: flameFlicker 1.5s ease-in-out infinite;
        transform-origin: 32px 40px;
      }
    </style>
  </defs>

  <!-- Flame base -->
  <g class="emoji-flame" filter="url(#fireGlow)">
    <!-- Main flame body -->
    <path d="M 32 52 Q 24 44 24 36 Q 24 24 32 16 Q 40 24 40 36 Q 40 44 32 52" 
          fill="url(#fireGradient)" 
          stroke="#FF6B35" 
          stroke-width="1.5"
          opacity="0.95"/>
    
    <!-- Inner flame (lighter) -->
    <path d="M 32 48 Q 28 42 28 36 Q 28 28 32 22 Q 36 28 36 36 Q 36 42 32 48" 
          fill="#FFD500" 
          opacity="0.7"/>
    
    <!-- Flame tip (brightest) -->
    <ellipse cx="32" cy="22" rx="4" ry="6" fill="#FFF5CC" opacity="0.9"/>
  </g>

  <!-- Streak number (white circle background) -->
  <circle cx="45" cy="20" r="10" fill="#ffffff" stroke="#FF6B35" stroke-width="2" box-shadow="0 4px 12px rgba(255, 107, 53, 0.3)"/>
  
  <!-- Number text -->
  <text x="45" y="25" font-size="14" font-weight="700" fill="#FF6B35" text-anchor="middle" font-family="'Montserrat', sans-serif">
    1
  </text>

  <!-- Sparkle particles around flame -->
  <g opacity="0.8">
    <circle cx="20" cy="30" r="1.2" fill="#FFD500"/>
    <circle cx="44" cy="28" r="0.8" fill="#FF6B35"/>
    <circle cx="18" cy="45" r="1" fill="#F7931E"/>
  </g>
</svg>