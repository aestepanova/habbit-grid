<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Category Emoji: Creativity (Творчество) -->
  <!-- Palette with brush strokes -->
  
  <defs>
    <linearGradient id="paletteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    
    <style>
      @keyframes paintSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .palette {
        animation: paintSpin 8s linear infinite;
        transform-origin: 32px 32px;
      }
      
      @keyframes brushStroke {
        0% { stroke-dashoffset: 20; opacity: 0; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: -20; opacity: 0; }
      }
      
      .brush-line {
        animation: brushStroke 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Main palette shape (kidney/organic) -->
  <g class="palette">
    <!-- Base palette -->
    <ellipse cx="32" cy="32" rx="14" ry="18" 
             fill="url(#paletteGradient)" stroke="#9333EA" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Thumb hole -->
    <circle cx="48" cy="42" r="4" fill="white" stroke="#9333EA" stroke-width="1"/>
    
    <!-- Color dots on palette -->
    <!-- Red -->
    <circle cx="22" cy="20" r="3" fill="#EF4444" opacity="0.8"/>
    <!-- Yellow -->
    <circle cx="30" cy="18" r="3" fill="#FBBF24" opacity="0.8"/>
    <!-- Blue -->
    <circle cx="38" cy="20" r="3" fill="#3B82F6" opacity="0.8"/>
    <!-- Green -->
    <circle cx="24" cy="32" r="3" fill="#10B981" opacity="0.8"/>
    <!-- Pink -->
    <circle cx="40" cy="32" r="3" fill="#EC4899" opacity="0.8"/>
    <!-- Purple -->
    <circle cx="32" cy="44" r="3" fill="#A855F7" opacity="0.8"/>
  </g>

  <!-- Paintbrush -->
  <g>
    <!-- Handle -->
    <rect x="48" y="8" width="3" height="24" rx="1.5" 
          fill="#92400E" stroke="#78350F" stroke-width="1"/>
    
    <!-- Bristles -->
    <ellipse cx="49.5" cy="32" rx="4" ry="5" 
             fill="#6B4226" stroke="#5A361A" stroke-width="1"/>
    
    <!-- Bristle details -->
    <line x1="46" y1="34" x2="44" y2="38" stroke="#8B5A2B" stroke-width="1" opacity="0.6"/>
    <line x1="53" y1="34" x2="55" y2="38" stroke="#8B5A2B" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Paint strokes (artistic flourish) -->
  <g stroke-width="2" fill="none" stroke-linecap="round">
    <!-- Stroke 1 (pink) -->
    <path d="M 54 12 Q 58 16 56 22" stroke="#EC4899" class="brush-line" style="animation-delay: 0s;"/>
    
    <!-- Stroke 2 (blue) -->
    <path d="M 56 24 Q 58 28 54 32" stroke="#3B82F6" class="brush-line" style="animation-delay: 0.4s;"/>
  </g>

  <!-- Shimmer effect (sparkle of creativity) -->
  <g opacity="0.6">
    <circle cx="18" cy="16" r="1.5" fill="#A855F7"/>
    <circle cx="50" cy="48" r="1" fill="#EC4899"/>
  </g>
</svg>